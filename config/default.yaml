# FILETS — configuration par défaut d'un run.
# Tout ce qui varie d'une expérience à l'autre se règle ici ou en ligne de commande,
# jamais dans le code (exigence C2).

run:
  seed: 42
  seasons: 10                 # nombre de saisons simulées
  stop_on_collapse: false     # arrêter le run (à la fin de la saison) si le lac s'effondre (stock sous collapse_ratio)
  stop_on_extinction: true    # arrêter le run, tout de suite, quand le lac est à 0 : il ne se repeuple jamais depuis 0

population:
  # Génération procédurale de la vallée : mêmes paramètres et même graine, même vallée (villages, pêcheurs, bateaux).
  villages: 4                 # nombre de villages autour du lac (1 à 8 ; au plus un par pêcheur)
  fishers: 8                  # nombre de pêcheurs (C2)
  boat_mix: {barque: 0.3, chaloupe: 0.5, cotre: 0.2}    # répartition des tailles de bateaux (le caractère l'infléchit)
  # random: true tire toute la vallée de la graine seule (villages, pêcheurs, flotte, lacs et leur poisson, patrouilles) ;
  # les valeurs ci-dessus et lake.lakes sont alors ignorées. false : la vallée est celle que décrivent ces réglages.
  random: false
  rule_fraction: 0.25         # part des pêcheurs à règles (A6) ; 1.0 = baseline sans LLM (E1)
  elder: true                 # l'ancien, arbitre sans pouvoir, ne pêche pas
  elder_kind: llm             # llm | rule
  large_model_min_experience: 15   # années d'expérience à partir desquelles un profil raisonne avec le grand modèle (A5)
  # custom: composition choisie à la main (menu de démarrage) ; remplace la génération ci-dessus.
  # Liste de fiches {first_name, hamlet, archetype, experience, wealth, debt_payment, kind: llm|rule, tier: auto|grand|petit}.
  # Quand elle est présente, `fishers` et `rule_fraction` sont déduits de la liste.

lake:
  capacity: auto              # nombre, ou "auto" = capacity_per_fisher × fishers (garde le même stock par tête quand on change d'échelle, C8)
  capacity_per_fisher: 12.5   # tonnes
  initial_ratio: 1.0          # stock initial / capacité
  growth_rate: 1.0            # taux de repeuplement r (croissance logistique, appliquée une fois par saison) ; rendement durable max = r·K/4
  # Plusieurs lacs : `count` lacs (1 à 4), les villages se partageant en blocs qui se suivent ; chaque lac a son poisson
  # (capacity_per_fisher par pêcheur du lac), son repeuplement et ses villages. Pour les décrire un à un :
  #   lakes: [{name: Vellmor, capacity: 100, stock_ratio: 0.8, growth_rate: 1.0, villages: [Ostrel, Bramois]}, ...]
  # (capacity : tonnes, ou "auto" avec `richness` : un multiplicateur de capacity_per_fisher ; stock_ratio : part pleine au départ)
  count: 1
  lakes: null
  collapse_ratio: 0.05        # sous ce ratio, le lac est considéré effondré
  observation_noise: 0.10     # erreur relative de l'estimation du stock par un pêcheur

economy:
  price_per_tonne: 100        # écus
  upkeep_per_season: 100      # coût de la vie d'une famille, hors bateau (écus par saison)
  # Les bateaux : `capacity` = prise maximale d'un pêcheur par saison (tonnes) ; `upkeep` = entretien du bateau (écus par saison,
  # en plus de la vie). Toutes les sorties ensemble sont aussi plafonnées à la moitié du lac : la part d'un bateau est
  # proportionnelle à sa capacité (6,25 t pour une chaloupe quand huit chaloupes se partagent un lac de 100 t).
  boats:
    barque: {capacity: 4.0, upkeep: 20}
    chaloupe: {capacity: 7.0, upkeep: 50}
    cotre: {capacity: 11.0, upkeep: 110}
  min_catch: 1                # prise minimale visée d'une sortie (tonnes) : on ne part pas pour rien
  # Ce que le lac laisse prendre : un bateau rapporte au plus sa cale, et au plus cette part du poisson qu'il y a dans son lac, partagée
  # entre les bateaux du lac en proportion de leur cale (voir `World.hold_of`). Un lac qui se vide laisse donc de moins en moins prendre.
  hold_fraction: 0.5
  # Pêcher dans un autre lac que celui de son village (voir `World.lake_options`) : `travel_days` jours de route pour traverser toute
  # la carte, à l'aller ; chaque sortie dure alors 1 + 2 × route jours au lieu d'un (la prise s'en ressent : 1 / (1 + 2 × route)) ;
  # et la route coûte `travel_cost` écus par jour de mer, à chaque sortie
  travel_days: 1.5
  travel_cost: 10
  # La pêche n'est pas toujours bonne : la prise visée est étalée sur `outings` sorties, et chacune rapporte selon le temps du jour
  # (le même pour tout le lac, plus rude pour les petits bateaux), la saison de l'année et les événements (voir `climate`),
  # l'expérience du pêcheur (plus dure quand le lac est bas) et sa chance. La chance varie de ±`luck` (écart-type) autour de 1 :
  # moitié forme de la saison, qui se prolonge d'une saison à l'autre, moitié forme du jour (`luck_streak` : un bon jour en
  # annonce un autre). 0 : ni chance ni malchance (seul le temps compte).
  outings: 6
  luck: 0.4
  luck_streak: 0.5

scenario:
  communication: valley       # valley (le conseil de la vallée) | hamlet (une veillée par village) | none
  # Au conseil de la vallée, chaque village est représenté par un élu : ses pêcheurs le choisissent à chaque saison selon la
  # confiance qu'ils lui font. Les autres villageois n'y vont pas (ils en apprennent les décisions). all : tous les pêcheurs y vont.
  council: delegates          # delegates | all
  # Chaque pêcheur déclare sa prise à l'ancien en rentrant, et peut mentir : seuls lui et le joueur connaissent la vraie.
  catches_visible: true       # les déclarations sont-elles connues de toute la vallée (sinon : du seul hameau) ?
  # Les mensonges se découvrent sur des indices, pas au hasard. Le lac a une zone par village (sa rive) et le large :
  # - la patrouille du lac, si le conseil en a voté une (elle coûte `patrol.cost` écus par pêcheur et par saison), est un agent :
  #   son capitaine décide seul, avant chaque saison, où aller (au plus `patrol.legs` étapes, `patrol.days` jours de mer en tout :
  #   une zone du lac, ou les talons d'un pêcheur) d'après ce que les villageois et les pêcheurs ont partagé (accusations, indices
  #   dits à la veillée). Elle repère les barques qu'elle croise (patrol) et mesure leur charge (à patrol_error près) ;
  # - un voisin qui pêche dans la même zone voit une barque rentrer (witness) et en estime la charge (à witness_error près) ;
  # - la barque d'un pêcheur interdit est vue partant à l'aube par son hameau (seen_leaving) ;
  # - un voisin remarque qu'un pêcheur vit bien pour ce qu'il déclare (lifestyle) ;
  # - l'ancien fait les comptes du lac (à lake_error × capacité près).
  # Les témoins qui n'ont rien à se reprocher parlent à la veillée (sauf contre un ami) ; les tricheurs se taisent. À
  # l'ouverture de la veillée, l'ancien relate ce que les indices établissent : un mensonge quand ils pèsent `proof` (patrouille 3,
  # témoin 1, départ vu 1, train de vie 0,5, comptes 0,5) et que la charge estimée dépasse la déclaration d'au moins margin_t
  # tonnes et margin_ratio. Il ne sanctionne pas : la confiance, chacun la juge ; l'exclusion de pêche, la vallée la vote.
  detection: {patrol: 0.9, patrol_error: 0.12, witness: 0.4, witness_error: 0.3, seen_leaving: 0.3, lifestyle: 0.5,
              lake_error: 0.03, margin_t: 0.3, margin_ratio: 0.25, proof: 2.0}
  # enabled : la patrouille fait-elle partie de la partie (false : ni vote, ni capitaine, ni coût) ; coût par pêcheur et par
  # saison (écus) ; étapes et jours de mer par saison ; from_season : une patrouille installée d'emblée dès cette saison, sans
  # vote du conseil (pour comparer des parties ; null : c'est au conseil de la voter)
  # count : nombre de patrouilles (chacune a son capitaine et sa route) ; cost : ce que chaque pêcheur paie par patrouille et par saison
  patrol: {enabled: true, count: 1, cost: 15, legs: 3, days: 14, from_season: null}
  # Tours de parole par veillée. Synchrone : on parle à tour de rôle et chacun entend les précédents (dialogues dépendants) ;
  # asynchrone : un seul tour, chacun s'exprime de son côté sans entendre les autres (dialogues indépendants), puis tous votent.
  assembly_rounds: 2
  # dès le 2e tour, ne reprend la parole que celui qui a une raison (on lui parle, on le nomme, on conteste sa proposition) ;
  # les autres écoutent, et leur position se recueille au bulletin de vote (bien moins de tokens, moins de redites)
  quiet_listeners: true
  proposal_merge_tolerance: 0.75   # deux quotas proposés à moins de 0,75 t l'un de l'autre sont la même proposition
  # (les autres types de règle — reserve, repos, sorties, bateau — ne se rejoignent que du même type et de la même cible ; leur écart
  #  de valeur toléré est fixé dans filets/rules.py : VALUE_TOLERANCE. Aucune clé nouvelle.)
  vote_tolerance: 1.5         # au vote de clôture, on vote pour la proposition la plus proche de ce qu'on a dit, à 1,5 t près
  promise_tolerance: 0.5      # tonnes tolérées au-dessus d'une promesse
  quota_tolerance: 0.05       # au-dessus d'un quota adopté, un arrondi, pas une marge : 2,5 t sous une règle de 2 t la dépasse
  # événements programmés (mêmes perturbations pour toutes les configurations comparées)
  scheduled_injections: []
  #  - {season: 4, type: drought}

# Le climat (voir `climate.py`) : chaque saison de jeu est une saison de l'année (printemps, été, automne, hiver), qui change ce que
# rapporte la pêche et la vitesse de repeuplement du lac ; des événements aléatoires (sécheresse, tempête, banc de poissons,
# algues, crue, maladie) s'y ajoutent à partir de la 2e saison, avec la probabilité `event_rate` par saison.
climate:
  enabled: true
  event_rate: 0.3
  disabled_events: []

time:
  # sync  : tous observent le même instant ; à la veillée, on parle à tour de rôle et chacun entend ceux qui ont parlé avant lui
  #         (dialogues dépendants). La lenteur d'une IA n'a aucun effet sur le temps du monde.
  # async : chacun va à son rythme, le temps du monde suit le temps réel ; à la veillée, chacun s'exprime de son côté sans
  #         entendre les autres (dialogues indépendants), puis tous votent (C4).
  mode: async
  season_days: 30
  fishing_open_day: 0.25      # J0 06:00
  fishing_close_day: 20.0     # au-delà, une sortie décidée trop tard est perdue
  assembly_day: 25.75         # J25 18:00, veillée chez l'ancien
  assembly_close_day: 29.0
  regrowth_day: 29.9
  ballot_lead_days: 0.25        # en async : les bulletins de vote sont remplis 6 h avant la fin de la veillée (une IA trop lente perd sa voix)
  assembly_turn_gap_days: 0.05  # en async : temps d'écoute (≈ 1 h 12) avant de reprendre la parole
  # en async : une fenêtre (pêche, veillée) ne se ferme pas tant qu'une IA réfléchit encore ; le temps du monde est suspendu
  # jusqu'à sa réponse. La partie ralentit avec une IA lente, mais aucune sortie ni réplique n'est perdue (false : elle rate son tour)
  wait_for_ai: true
  # rythme propre de chaque pêcheur en mode asynchrone : décalage (jours) avant sa première réflexion
  async_offset_days: [0.0, 4.0]
  # conversion temps réel → temps simulé : heures simulées par seconde réelle.
  # En async, c'est elle qui transforme la latence d'un LLM en durée dans le monde
  # (à 3 h/s, un modèle qui réfléchit 10 s agit 30 h plus tard). C'est un paramètre du
  # modèle de temps : son effet sur le phénomène doit être mesuré (C5, O10).
  sim_hours_per_second: 3
  # en async, quand aucun agent ne réfléchit, l'horloge accélère de ce facteur (inf = saut direct)
  idle_speedup: 40
  fast: false                 # true = aucune attente d'affichage (runs répétés, tests)

memory:
  top_k: 6
  recency_decay_per_day: 0.01
  weights: {recency: 1.0, importance: 1.0, relevance: 1.5}

rag:
  corpus_dir: corpus
  top_k: 3
  lore_per_agent: 4                    # moments marquants de la partie gardés par agent (le moins important part d'abord)
  # bm25    : corpus et souvenirs cherchés en mémoire, par mots (par défaut : aucun service, aucun calcul de vecteur).
  # pgvector : corpus et souvenirs rangés dans PostgreSQL + pgvector avec leur vecteur, cherchés par le sens
  #            (voir config/data.yaml et `vectors.py`). Si la base tombe en cours de partie, BM25 prend le relais.
  backend: bm25
  min_score: 0.0                       # pgvector : similarité cosinus minimale d'un passage retenu
  embeddings: {kind: hash, dim: 384}   # pgvector : hash (sans modèle, pour les tests) | ollama (modèle de plongement)

storage:
  history: sqlite            # historique des parties : sqlite (output.history_db) | postgres
  postgres:
    dsn: "postgresql://filets:filets@127.0.0.1:19432/filets"   # la variable FILETS_PG_DSN l'emporte (docker-compose : port 19432)
  objects: {kind: none}      # fichiers bruts (corpus, archives des parties) : none | local | s3 (voir config/data.yaml)

llm:
  temperature: 0.7
  max_tokens: 350
  # complete : réponses libres, contexte complet (profil de référence des expériences).
  # rapide   : une phrase courte par champ, contexte allégé, longueur de réponse bornée (≈ 2× plus rapide sur un modèle local).
  # adaptive : système 1 (réflexe : un nombre, ~150 tokens, petit modèle) pour les prises de routine, système 2 (rapide) sinon.
  reflection: complete
  timeout_s: 45
  max_retries: 3
  json_mode: true
  tiers:
    grand: {provider: scripted, model: scripted-grand}
    petit: {provider: scripted, model: scripted-petit}
  providers:
    scripted:      # faux LLM déterministe : sert à tester la chaîne sans clé ni GPU, jamais à conclure
      latency_s: {grand: [1.0, 4.0], petit: [0.3, 1.2]}
      latency_scale: 1.0
      incident_rates: {out_of_role: 0.03, unparseable: 0.03, no_response: 0.02}
    # Ollama (local) : délai long (un modèle froid met du temps à se charger, et à 8 pêcheurs en synchrone les requêtes
    # se partagent la carte graphique) et au plus 4 requêtes à la fois, le reste attend de ce côté-ci.
    # json_schema : Ollama contraint la réponse au schéma demandé (tous les champs, dans l'ordre) ; sinon JSON libre.
    # seed : Ollama respecte la graine envoyée (stable par partie, agent, saison, nature, tour) : même prompt, même réponse.
    ollama:     {base_url: "http://localhost:11434/v1", api_key_env: null, rpm: 0, timeout_s: 240, max_concurrency: 4,
                 json_schema: true, seed: true, local: true}
    # Modèles de décision « système 1 » d'Ollama (POST /v1/systemone, Ollama ≥ 0.40.4 pour tev1) : une question typée, une
    # réponse d'un token avec ses probabilités. Utilisés par le niveau `reflexe` (voir config/ollama_open.yaml).
    ollama_s1:  {base_url: "http://localhost:11434/v1", kind: systemone, local: true, timeout_s: 60, max_concurrency: 4}
    groq:       {base_url: "https://api.groq.com/openai/v1", api_key_env: GROQ_API_KEY, rpm: 25}
    openrouter: {base_url: "https://openrouter.ai/api/v1", api_key_env: OPENROUTER_API_KEY, rpm: 15}
    gemini:     {base_url: "https://generativelanguage.googleapis.com/v1beta/openai", api_key_env: GEMINI_API_KEY, rpm: 10}
    mistral:    {base_url: "https://api.mistral.ai/v1", api_key_env: MISTRAL_API_KEY, rpm: 30}
    github:     {base_url: "https://models.github.ai/inference", api_key_env: GITHUB_TOKEN, rpm: 10}

bus:
  kind: local                 # local | kafka
  bootstrap: "127.0.0.1:19092"      # docker-compose : port 19092, pour ne pas gêner un autre projet sur 9092
  topics:
    events: filets.events
    indicators: filets.indicators
    commands: filets.commands
    deadletter: filets.deadletter
    status: filets.status        # état du moteur (salon, en cours, pause, vitesse…), conservé une heure

output:
  runs_dir: runs
  history_db: data/history.db
