# Stockage « données » : PostgreSQL + pgvector pour le RAG (corpus et souvenirs des agents, avec leur vecteur) et pour
# l'historique des parties (au lieu de SQLite) ; stockage objet compatible S3 pour les fichiers bruts (documents du
# corpus, archive de chaque partie).
#   docker compose --profile data up -d        → PostgreSQL 17 + pgvector (port 19432), MinIO S3 (port 19000, console 19001)
#   ollama pull embeddinggemma                 → modèle de plongement multilingue (300 M paramètres, 768 dimensions)
#   python -m filets serve --config config/data.yaml --llm ollama_open
# Le modèle de plongement tourne sur le processeur (`cpu: true`) pour laisser la carte graphique aux modèles de langage.
extends: default.yaml
rag:
  backend: pgvector
  embeddings: {kind: ollama, base_url: "http://localhost:11434", model: embeddinggemma, dim: 768, cpu: true}
storage:
  history: postgres
  objects:
    kind: s3
    endpoint: "127.0.0.1:19000"
    bucket: filets
    secure: false
    # identifiants du conteneur local (docker-compose.yml) ; ailleurs : FILETS_S3_ACCESS_KEY / FILETS_S3_SECRET_KEY
    access_key: filets
    secret_key: filets-secret
