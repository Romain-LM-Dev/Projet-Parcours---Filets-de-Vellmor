# Kafka en mode KRaft (sans ZooKeeper), un seul nœud : suffisant pour le projet.
#   docker compose up -d                → broker sur 127.0.0.1:19092
#   docker compose --profile ui up -d   → + interface web Kafka UI sur http://localhost:8080
#   docker compose --profile data up -d → + PostgreSQL 17 + pgvector (127.0.0.1:19432) et stockage objet MinIO (S3 sur
#                                         127.0.0.1:19000, console sur http://127.0.0.1:19001), pour config/data.yaml
# Ports 19xxx et non les ports standard (9092, 5432, 9000) : un autre projet ou un PostgreSQL installé sur la machine peut
# les tenir. FILETS a ses propres conteneurs, volumes et identifiants, et tourne en même temps qu'un autre projet.
# Tout n'écoute que sur la machine locale (127.0.0.1) : identifiants de développement.
services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: filets-kafka
    ports:
      - "127.0.0.1:19092:19092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://127.0.0.1:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # les topics sont créés explicitement par le code (bus.ensure_topics)
    volumes:
      - kafka-data:/var/lib/kafka/data

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    profiles: ["ui"]
    depends_on: [kafka]
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: filets
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  postgres:
    image: pgvector/pgvector:pg17
    container_name: filets-postgres
    profiles: ["data"]
    ports:
      - "127.0.0.1:19432:5432"
    environment:
      POSTGRES_USER: filets
      POSTGRES_PASSWORD: filets
      POSTGRES_DB: filets
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filets -d filets"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Stockage objet compatible S3 : MinIO (AGPLv3). L'image minio/minio n'est plus publiée sur Docker Hub ; celle de
  # Chainguard l'est, et maintenue. Elle tourne en root dans le conteneur : son utilisateur par défaut ne peut pas écrire
  # dans le volume. N'importe quel service S3 convient : voir storage.objects dans config/data.yaml.
  objects:
    image: cgr.dev/chainguard/minio:latest
    container_name: filets-objects
    profiles: ["data"]
    user: "0"
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "127.0.0.1:19000:9000"     # API S3
      - "127.0.0.1:19001:9001"     # console web
    environment:
      MINIO_ROOT_USER: filets
      MINIO_ROOT_PASSWORD: filets-secret
    volumes:
      - minio-data:/data

volumes:
  kafka-data:
  postgres-data:
  minio-data:
